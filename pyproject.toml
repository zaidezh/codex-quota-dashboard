[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-quota-system"
version = "0.3.0"
description = "Local M1-M2-M3 evidence, explanation fitting and conditional quota forecasting"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Codex Quota System contributors" }]
keywords = ["codex", "quota", "forecasting", "fitting", "privacy", "monitoring"]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.14,<2",
  "tzdata>=2025.2; platform_system == 'Windows'",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<9"]

[project.urls]
Homepage = "https://github.com/zaidezhang728-arch/codex-quota-dashboard"
Documentation = "https://github.com/zaidezhang728-arch/codex-quota-dashboard#readme"
Repository = "https://github.com/zaidezhang728-arch/codex-quota-dashboard.git"
Issues = "https://github.com/zaidezhang728-arch/codex-quota-dashboard/issues"

[project.scripts]
codex-quota-system = "codex_quota_dashboard.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_quota_dashboard = ["data/*.json", "static/*", "static/vendor/*"]
